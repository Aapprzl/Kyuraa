<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyuraa - Personal AI Assistant</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23D97757'/><text x='50' y='68' font-family='Inter, sans-serif' font-size='55' font-weight='600' fill='white' text-anchor='middle'>K</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #F9F7F4;
            --bg-surface: #FFFFFF;
            --bg-sidebar: #F0EDE8;
            --bg-hover: #E8E4DF;
            --border: #E2DDD8;
            --border-strong: #C8C2BB;
            --accent: #D97757;
            --accent-hover: #C4633E;
            --accent-light: #FDF0EB;
            --text-primary: #1A1814;
            --text-secondary: #6B6560;
            --text-muted: #9B938D;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --user-bubble: #D97757;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-sidebar);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-strong);
        }

        /* Messages and sidebar scrollbar */
        #sessions-list::-webkit-scrollbar,
        #messages-container::-webkit-scrollbar {
            width: 4px;
        }
        #sessions-list::-webkit-scrollbar-thumb,
        #messages-container::-webkit-scrollbar-thumb {
            background: var(--border);
        }

        /* Header */
        #app-header {
            display: grid;
            grid-template-columns: 260px 1fr auto;
            align-items: center;
            height: 56px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-surface);
            padding: 0 16px;
            flex-shrink: 0;
        }

        #app-header button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            color: var(--text-secondary);
            transition: all 0.15s;
        }

        #app-header button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        #header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #sidebar-toggle {
            font-size: 20px;
        }

        #header-center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: flex-end;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .logo-version {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-sidebar);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* When sidebar is collapsed, left column goes away */
        body:has(#sidebar.collapsed) #app-header {
            grid-template-columns: auto 1fr auto;
        }

        #model-badge {
            font-size: 11px;
            color: var(--text-muted);
            padding: 4px 10px;
            background: var(--bg-sidebar);
            border-radius: 16px;
        }

        #connection-status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: var(--bg-sidebar);
            border-radius: 16px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .skill-indicator {
            display: flex;
            align-items: center;
        }

        .skill-badge {
            font-size: 11px;
            padding: 4px 10px;
            background: var(--accent-light);
            color: var(--accent);
            border-radius: 16px;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }

        .status-dot.connected {
            background-color: #27ae60;
            box-shadow: 0 0 6px rgba(39, 174, 96, 0.5);
        }

        .status-dot.disconnected {
            background-color: #e74c3c;
            box-shadow: 0 0 6px rgba(231, 76, 60, 0.5);
        }

        .status-dot.connecting {
            background-color: #f39c12;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }


        #user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
        }

        /* Main Layout */
        #app-layout {
            display: flex;
            height: calc(100vh - 56px);
            overflow: hidden;
        }

        /* Sidebar */
        #sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.25s ease, width 0.25s ease, opacity 0.25s ease;
        }

        #sidebar.collapsed {
            transform: translateX(-100%);
            width: 0;
            min-width: 0;
            opacity: 0;
            border: none;
            overflow: hidden;
        }

        #new-session-btn {
            margin: 16px;
            padding: 12px 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        #new-session-btn:hover {
            background: var(--accent-hover);
        }

        #sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px;
        }

        .session-item {
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: background 0.15s;
            border: 1px solid transparent;
        }

        .session-item:hover {
            background: var(--bg-hover);
        }

        .session-item.active {
            background: var(--bg-surface);
            border-color: var(--border);
        }

        .session-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .session-preview {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        #sidebar-settings-btn {
            width: 100%;
            padding: 10px;
            background: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }

        #sidebar-settings-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        /* Chat Area */
        #chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-base);
        }

        /* Welcome Screen */
        #welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        #welcome-screen h1 {
            font-size: 42px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        #welcome-screen p {
            font-size: 15px;
            color: var(--text-secondary);
            max-width: 400px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        #example-prompts {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 500px;
        }

        .example-prompt {
            padding: 10px 16px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .example-prompt:hover {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Messages Container */
        #messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* User Bubble */
        .message-user {
            display: flex;
            justify-content: flex-end;
            animation: fadeIn 0.3s ease-out;
        }

        .message-user .bubble {
            background: var(--user-bubble);
            color: white;
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 20px 20px 4px 20px;
            font-size: 14px;
            line-height: 1.5;
            box-shadow: var(--shadow-sm);
        }

        /* Agent Bubble */
        .message-agent {
            display: flex;
            justify-content: flex-start;
            animation: fadeIn 0.3s ease-out;
        }

        .message-agent .bubble {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 20px 20px 20px 4px;
            font-size: 14px;
            line-height: 1.6;
            box-shadow: var(--shadow-sm);
        }

        .message-agent .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-sidebar);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            flex-shrink: 0;
            font-size: 14px;
        }

        .message-agent .content {
            display: flex;
            align-items: flex-start;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1.1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Message bubbles animation */
        .message-user,
        .message-agent {
            animation: fadeInUp 0.2s ease-out forwards;
        }

        /* Input Area */
        #input-area {
            border-top: 1px solid var(--border);
            padding: 16px 24px 20px;
            background: var(--bg-surface);
            flex-shrink: 0;
        }

        #skill-badge-active {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--accent-light);
            border-radius: 20px;
            margin-bottom: 12px;
            width: fit-content;
        }

        #skill-badge-active .skill-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
        }

        #skill-badge-active .skill-remove {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            padding: 0;
            font-size: 14px;
            line-height: 1;
        }

        #input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(217, 119, 87, 0.1);
        }

        #message-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 14px;
            color: var(--text-primary);
            resize: none;
            max-height: 120px;
            line-height: 1.5;
            outline: none;
            font-family: inherit;
        }

        #message-input::placeholder {
            color: var(--text-muted);
        }

        #send-btn {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            border: none;
            background: var(--accent);
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s;
            flex-shrink: 0;
        }

        #send-btn:hover {
            background: var(--accent-hover);
        }

        #send-btn:active {
            transform: scale(0.95);
        }

        #send-btn:disabled {
            background: var(--border-strong);
            cursor: not-allowed;
        }

        #input-footer {
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Settings Panel */
        #settings-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: flex-end;
            z-index: 100;
            animation: fadeIn 0.2s ease-out;
        }

        #settings-overlay.hidden {
            display: none;
        }

        #settings-panel {
            width: 400px;
            max-width: 100%;
            background: var(--bg-surface);
            height: 100%;
            display: flex;
            flex-direction: column;
            animation: scaleIn 0.2s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        #settings-panel header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #settings-panel h2 {
            font-size: 18px;
            font-weight: 600;
        }

        #settings-close {
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
        }

        #settings-close:hover {
            background: var(--bg-hover);
        }

        #settings-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .settings-section {
            margin-bottom: 24px;
        }

        .settings-section h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .settings-field {
            margin-bottom: 16px;
        }

        .settings-field label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .settings-field input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-primary);
            background: var(--bg-base);
            transition: border-color 0.2s;
        }

        .settings-field input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .settings-field input::placeholder {
            color: var(--text-muted);
        }

        #save-settings-btn, .save-provider-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        #save-settings-btn:hover, .save-provider-btn:hover {
            background: var(--accent-hover);
        }

        /* Hidden utility */
        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 768px) {
            #sidebar {
                position: absolute;
                z-index: 50;
                height: calc(100vh - 56px);
                top: 56px;
            }

            #sidebar.collapsed {
                transform: translateX(-100%);
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header id='app-header'>
        <div id='header-left'>
            <button id='sidebar-toggle'>☰</button>
            <div class="logo-group">
                <span class='logo-text'>Kyuraa</span>
                <span class='logo-version'>v1.0</span>
            </div>
        </div>
        <div id='header-center'>
            <div id='model-badge'>Loading...</div>
        </div>
        <div id='header-right'>
            <div id='connection-status'>
                <span class='status-dot disconnected'></span>
                <span class='status-text'>Offline</span>
            </div>
            <div id='user-avatar'>K</div>
        </div>
    </header>

    <!-- MAIN LAYOUT -->
    <div id='app-layout'>
        <!-- SIDEBAR KIRI -->
        <aside id='sidebar'>
            <button id='new-session-btn'>+ Sesi Baru</button>
            <div id='sessions-list'>
                <!-- Diisi JavaScript -->
            </div>
            <div id='sidebar-footer'>
                <button id='sidebar-settings-btn'>⚙ Pengaturan</button>
            </div>
        </aside>

        <!-- CHAT AREA -->
        <main id='chat-area'>
            <!-- Welcome screen (tampil saat tidak ada chat) -->
            <div id='welcome-screen'>
                <h1>Kyuraa</h1>
                <p>Asisten AI pribadi dengan berbagai skill akademik.</p>
                <div id='example-prompts'>
                    <button class='example-prompt' data-prompt='Aktifkan skill penerjemah Arab'>Aktifkan skill penerjemah Arab</button>
                    <button class='example-prompt' data-prompt='Bantu analisis data R&D 4D'>Bantu analisis data R&D 4D</button>
                    <button class='example-prompt' data-prompt='Ngobrol santai'>Ngobrol santai</button>
                </div>
            </div>

            <!-- Messages container -->
            <div id='messages-container' class='hidden'>
                <!-- Diisi JavaScript -->
            </div>

            <!-- Input area -->
            <div id='input-area'>
                <div id='skill-badge-active' class='hidden'>
                    <span class='skill-name'>terjemah</span>
                    <button class='skill-remove'>✕</button>
                </div>
                <div id='input-wrapper'>
                    <textarea id='message-input'
                        placeholder='Ketik pesan atau pertanyaanmu...'
                        rows='1'></textarea>
                    <button id='send-btn'>↑</button>
                </div>
                <div id='input-footer'>
                    Enter untuk kirim · Shift+Enter baris baru
                </div>
            </div>
        </main>
    </div>

    <!-- SETTINGS PANEL (hidden by default) -->
    <div id='settings-overlay' class='hidden'>
        <div id='settings-panel'>
            <header>
                <h2>Pengaturan</h2>
                <button id='settings-close'>✕</button>
            </header>
            <div id='settings-content'>
                <!-- Konten setting dipindah ke sini -->
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id='confirm-modal' class='hidden'>
        <div class='confirm-backdrop'></div>
        <div class='confirm-dialog'>
            <h3>Konfirmasi</h3>
            <p id='confirm-message'>Apakah Anda yakin?</p>
            <div class='confirm-actions'>
                <button id='confirm-cancel'>Batal</button>
                <button id='confirm-ok'>Ya, Lanjutkan</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id='toast-container'></div>

    <!-- Disconnect Overlay -->
    <div id='disconnect-overlay' class='hidden'>
        <div class='disconnect-content'>
            <div class='disconnect-icon'>⚡</div>
            <h2>Koneksi Terputus</h2>
            <p>Server tidak merespons. Memeriksa koneksi...</p>
            <div id='reconnect-status'>Mencoba menghubungkan...</div>
            <div class='disconnect-actions'>
                <button id='reconnect-btn'>🔄 Sambung Ulang</button>
                <button id='reload-btn'>🔁 Reload Halaman</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // STATE
        // ============================================
        let ws = null;
        let currentSessionId = null;
        let sessions = [];
        let currentAgentMessage = null;
        let currentAgentContent = '';
        let lastUserMessage = '';
        let isConnected = false;
        let activeSkill = null;
        let sessionStartTime = null;
        let sessionStats = { requests: 0, inputTokens: 0, outputTokens: 0 };
        let typingStartTime = 0;
        let pendingReplace = null;

        // ============================================
        // DOM ELEMENTS
        // ============================================
        const sessionsList = document.getElementById('sessions-list');
        const messagesContainer = document.getElementById('messages-container');
        const welcomeScreen = document.getElementById('welcome-screen');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const settingsOverlay = document.getElementById('settings-overlay');
        const settingsContent = document.getElementById('settings-content');
        const modelBadge = document.getElementById('model-badge');
        const toastContainer = document.getElementById('toast-container');
        const confirmModal = document.getElementById('confirm-modal');

        // ============================================
        // UTILITIES
        // ============================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function formatRelativeDate(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const diffMs = now - date;
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) return 'Hari ini';
            if (diffDays === 1) return 'Kemarin';
            if (diffDays === 2) return '2 hari lalu';

        // ============================================
        // WEBSOCKET
        // ============================================
        let isIntentionalClose = false;

        function updateConnectionStatus(status) {
            const dot = document.querySelector('.status-dot');
            const text = document.querySelector('.status-text');
            if (!dot || !text) return;
            
            dot.className = 'status-dot ' + status;
            if (status === 'connected') {
                text.textContent = 'Online';
            } else if (status === 'disconnected') {
                text.textContent = 'Offline';
            } else if (status === 'connecting') {
                text.textContent = 'Menghubungi...';
            }
        }

        function connectWebSocket(sessionId) {
            if (!sessionId) {
                console.error('connectWebSocket called with invalid sessionId:', sessionId);
                return;
            }
            
            isIntentionalClose = false;
            updateConnectionStatus('connecting');
            
            if (ws) {
                ws.close();
                ws = null;
            }
            
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${location.host}/ws/${sessionId}`;
            console.log('Connecting to:', wsUrl);
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                console.log('WS Connected successfully');
                isConnected = true;
                updateConnectionStatus('connected');
                hideDisconnectOverlay();
                fetchSkillStatus();
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleWsMessage(data);
            };
            
            ws.onerror = (event) => {
                console.error('WS Error:', event);
                isConnected = false;
                updateConnectionStatus('disconnected');
            };
            
            ws.onclose = (event) => {
                console.log('WS Closed:', event.code, event.reason || '');
                isConnected = false;
                updateConnectionStatus('disconnected');
                
                if (!isIntentionalClose) {
                    showDisconnectOverlay();
                }
                isIntentionalClose = false;
            };
        }

        function disconnectWebSocket() {
            isIntentionalClose = true;
            if (ws) {
                ws.close();
                ws = null;
            }
            isConnected = false;
        }

        function showDisconnectOverlay() {
            document.getElementById('disconnect-overlay').classList.remove('hidden');
        }

        function hideDisconnectOverlay() {
            document.getElementById('disconnect-overlay').classList.add('hidden');
        }

        function manualReconnect() {
            if (currentSessionId) connectWebSocket(currentSessionId);
        }

        document.getElementById('reconnect-btn').addEventListener('click', manualReconnect);
        document.getElementById('reload-btn').addEventListener('click', () => window.location.reload());

        function handleWsMessage(data) {
            if (data.type === 'token') {
                appendToken(data.content);
            } else if (data.type === 'done') {
                finishAgentMessage(data);
            } else if (data.type === 'error') {
                showToast(data.message, 'error');
                finishAgentMessage(data);
            } else if (data.type === 'file_saved') {
                showToast('File disimpan', 'success');
            }
        }

        async function loadSessions() {
            try {
                const res = await fetch('/sessions');
                const data = await res.json();
                // Filter out __system__ session
                sessions = (data.sessions || []).filter(s => s.session_id !== '__system__');
                renderSessions();
            } catch (e) {
                console.error('Failed to load sessions:', e);
                showToast('Gagal memuat sesi', 'error');
            }
        }

        function renderSessions() {
            if (sessions.length === 0) {
                sessionsList.innerHTML = '<div class="no-sessions">Belum ada sesi</div>';
                return;
            }
            
            // Group sessions by time
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today.getTime() - 86400000);
            const weekAgo = new Date(today.getTime() - 7 * 86400000);
            
            const groups = {
                'Hari ini': [],
                'Kemarin': [],
                '7 Hari Terakhir': [],
                'Lebih Lama': []
            };
            
            sessions.forEach(s => {
                const date = new Date(s.updated_at);
                if (date >= today) {
                    groups['Hari ini'].push(s);
                } else if (date >= yesterday) {
                    groups['Kemarin'].push(s);
                } else if (date >= weekAgo) {
                    groups['7 Hari Terakhir'].push(s);
                } else {
                    groups['Lebih Lama'].push(s);
                }
            });
            
            let html = '';
            Object.entries(groups).forEach(([groupName, groupSessions]) => {
                if (groupSessions.length === 0) return;
                
                html += `<div class="session-group-label">${groupName}</div>`;
                html += groupSessions.map(s => `
                    <div class="session-item ${s.session_id === currentSessionId ? 'active' : ''}" 
                         data-id="${s.session_id}">
                        <div class="session-name">${escapeHtml(s.name || 'Sesi baru')}</div>
                        <div class="session-preview">
                            ${s.updated_at ? formatRelativeDate(s.updated_at) : ''} · ${s.message_count || 0} pesan
                        </div>
                        <button class="session-delete" onclick="event.stopPropagation(); deleteSession('${s.session_id}')">🗑</button>
                    </div>
                `).join('');
            });
            
            sessionsList.innerHTML = html;
            
            // Add click handlers
            document.querySelectorAll('.session-item').forEach(item => {
                item.addEventListener('click', () => selectSession(item.dataset.id));
            });
        }

        async function selectSession(sessionId) {
            // Disconnect any existing WS first
            disconnectWebSocket();
            
            currentSessionId = sessionId;
            renderSessions();
            
            // Load messages
            try {
                const res = await fetch(`/sessions/${sessionId}/messages`);
                const data = await res.json();
                const messages = data.messages || [];
                renderMessages(messages);
                
                // Show welcome screen ONLY if messages container is empty
                if (messages.length === 0) {
                    welcomeScreen.classList.remove('hidden');
                    messagesContainer.classList.add('hidden');
                } else {
                    welcomeScreen.classList.add('hidden');
                    messagesContainer.classList.remove('hidden');
                }
            } catch (e) {
                console.error('Failed to load messages:', e);
            }
            
            // Connect WebSocket
            connectWebSocket(sessionId);
            
            // Update active state in UI
            document.querySelectorAll('.session-item').forEach(item => {
                item.classList.toggle('active', item.dataset.id === sessionId);
            });

        function appendUserMessage(text) {
            const div = document.createElement('div');

        function startAgentMessage() {
            currentAgentContent = '';
            currentAgentMessage = document.createElement('div');
            currentAgentMessage.className = 'message-agent';
            currentAgentMessage.innerHTML = `
                <div class="avatar">🤖</div>
                <div class="content">

        function appendToken(token) {
            currentAgentContent += token;

            if (!currentAgentMessage) {
                // Fallback: bubble tidak dibuat di sendMessage() (e.g. dari pesan lama)
                startAgentMessage();
                typingStartTime = Date.now();
                replaceDotsWithText();
                return;
            }

            const bubble = currentAgentMessage.querySelector('.bubble');
            const indicator = bubble?.querySelector('.typing-indicator');

            if (indicator) {
                // Dots masih tampil — pastikan minimum 800ms sebelum replace
                const elapsed = Date.now() - typingStartTime;
                if (elapsed >= 800) {
                    replaceDotsWithText();
                } else if (!pendingReplace) {
                    pendingReplace = setTimeout(() => {
                        pendingReplace = null;
                        replaceDotsWithText();
                    }, 800 - elapsed);
                }
            } else {
                // Dots sudah hilang, langsung append teks
                bubble.innerHTML = renderContent(currentAgentContent);
                scrollToBottom();
            }
        }

        function replaceDotsWithText(bubble) {
            const indicator = bubble.querySelector('.typing-indicator');
            if (indicator) {
                indicator.remove();
            }
            bubble.innerHTML = renderContent(currentAgentContent);
            scrollToBottom();
        }

        function parseMarkdown(text) {
            return text
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>')
                .replace(/`(.+?)`/g, '<code>$1</code>');
        }

        function renderContent(text) {
            if (!text) return '';

            // First escape HTML to prevent XSS
            let html = escapeHtml(text);

            // Extract code blocks first (before markdown parsing)
            const codeBlockPattern = /```[\s\S]*?```/g;
            const codeBlocks = [];
            html = html.replace(codeBlockPattern, (match, offset) => {
                const idx = codeBlocks.length;
                const codeContent = match.slice(4, -3);
                codeBlocks.push(`<pre class="code-block">${codeContent}</pre>`);
                return `%%CODEBLOCK_${idx}%%`;
            });

            // Parse markdown: **bold**, *italic*, `inline code`
            html = parseMarkdown(html);

            // Restore code blocks
            html = html.replace(/%%CODEBLOCK_(\d+)%%/g, (_, i) => codeBlocks[parseInt(i)]);

            // Preserve newlines by converting to <br>
            html = html.replace(/\n/g, '<br>');

            // Preserve multiple spaces
            html = html.replace(/  /g, '&nbsp; ');

            // Detect Arabic text blocks and apply RTL styling
            const arabicPattern = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]+/g;
            if (arabicPattern.test(html)) {
                html = html.replace(/([\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]+)/g, '<span class="arabic-text" dir="rtl" lang="ar">$1</span>');
            }

            return html;
        }

        function finishAgentMessage(data) {
            if (!currentAgentMessage) return;

            if (pendingReplace) {
                clearTimeout(pendingReplace);
                pendingReplace = null;
            }

            const bubble = currentAgentMessage.querySelector('.bubble');

            // Remove any residual typing indicator
            const indicator = bubble.querySelector('.typing-indicator');
            if (indicator) indicator.remove();

            bubble.innerHTML = renderContent(currentAgentContent);
            
            // Update stats
            if (data.usage) {
                sessionStats.requests++;
                sessionStats.inputTokens += data.usage.input_tokens || 0;
                sessionStats.outputTokens += data.usage.output_tokens || 0;
                updateStatsBar();
            }
            
            // Fetch global stats and update settings panel
            fetch('/stats').then(r => r.json()).then(stats => {
                const reqEl = document.getElementById('usage-requests');
                const inEl = document.getElementById('usage-input');
                const outEl = document.getElementById('usage-output');
                const totEl = document.getElementById('usage-total');
                if (reqEl) reqEl.textContent = stats.total_requests || 0;
                if (inEl) inEl.textContent = stats.input_tokens || 0;
                if (outEl) outEl.textContent = stats.output_tokens || 0;
                if (totEl) totEl.textContent = stats.total_tokens || 0;
            });
            
            // Check for skill activation in response
            const activatedMatch = currentAgentContent.match(/✅\s*Skill\s*\*?\*?([^\s*]+)\*?\*?\s*aktif/);
            if (activatedMatch) {
                showSkillBadge(activatedMatch[1]);
            }
            if (currentAgentContent.includes('✅ Skill dinonaktifkan') || currentAgentContent.includes('Skill dinonaktifkan')) {
                hideSkillBadge();
            }
            
            // Update session name with first 50 chars of user message
            if (currentSessionId && lastUserMessage) {
                const session = sessions.find(s => s.session_id === currentSessionId);
                if (session && (!session.name || session.name === 'Sesi baru')) {
                    const newName = lastUserMessage.substring(0, 50).replace(/\n/g, ' ').trim() + (lastUserMessage.length > 50 ? '...' : '');
                    session.name = newName;
                    fetch(`/sessions/${currentSessionId}/name`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: newName })
                    }).then(() => {
                        renderSessions();
                    });
                }
                lastUserMessage = '';
            }
            
            // Refresh sessions to get updated names
            loadSessions();
            
            currentAgentMessage = null;
            currentAgentContent = '';
            
            sendBtn.disabled = false;
            scrollToBottom();
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            // If no current session, create one first
            if (!currentSessionId) {
                const newId = generateId();
                currentSessionId = newId;

                // Add to local sessions array
                sessions.unshift({
                    session_id: newId,
                    name: 'Sesi baru',
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString(),
                    message_count: 0
                });
                renderSessions();

                // Connect WebSocket
                connectWebSocket(newId);

                // Wait for WS to be connected
                for (let i = 0; i < 10; i++) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    if (isConnected) break;
                }
            }

            if (!isConnected) {
                showToast('Tidak terhubung ke server', 'error');
                return;
            }

            // Start timing
            sessionStartTime = Date.now();

            // If still on welcome screen, switch to messages container
            if (!welcomeScreen.classList.contains('hidden')) {
                welcomeScreen.classList.add('hidden');
                messagesContainer.classList.remove('hidden');
            }

            // Store user message for auto-naming
            lastUserMessage = text;

            // Add user message bubble immediately
            appendUserMessage(text);

            // Show typing indicator immediately — before server responds
            currentAgentContent = '';
            startAgentMessage();
            typingStartTime = Date.now();

            // Send via WebSocket
            ws.send(JSON.stringify({ type: 'message', content: text }));

            // Clear input
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // Disable send button while waiting
            sendBtn.disabled = true;

            updateStatsBar();
            scrollToBottom();
        }

                    `;
                } else {
                    skillsList.innerHTML = '<div class="no-skills">Belum ada skill terpasang</div>';
                }
            });
            
            // Download template button
            const downloadBtn = document.getElementById('download-template-btn');
            if (downloadBtn) {
                downloadBtn.addEventListener('click', () => {
                    window.location.href = '/skills/template';
                });
            }
            
            // Save button handlers (multiple buttons)
            document.querySelectorAll('.save-provider-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const provider = btn.dataset.provider;
                    const model = document.getElementById(`setting-${provider === 'openrouter' ? 'or' : 'google'}-model`).value.trim();
                    const apiKey = document.getElementById(`setting-${provider === 'openrouter' ? 'or' : 'google'}-api-key`).value.trim();
                    
                    if (!model || !apiKey) {
                        showToast('Mohon isi model dan API Key', 'error');
                        return;
                    }
                    
                    const originalText = btn.textContent;
                    btn.textContent = '⏳ Memvalidasi...';
                    btn.disabled = true;
                    
                    try {
                        const res = await fetch('/settings/validate-and-save', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ provider, model, api_key: apiKey })
                        });
                        const data = await res.json();
                        
                        if (res.ok) {
                            showToast(`Koneksi ${provider} berhasil!`, 'success');
                            renderSettingsContent(); // Refresh UI to show active provider
                            fetchModelInfo();
                        } else {
                            showToast(data.detail || 'Gagal menyimpan', 'error');
                        }
                    } catch (e) {
                        showToast('Gagal terhubung ke server', 'error');
                    } finally {
                        btn.textContent = originalText;
                        btn.disabled = false;
                    }
                });
            });
        }

        // ============================================
        // CONFIRM MODAL
        // ============================================
        let confirmCallback = null;

        function showConfirm(message, onConfirm) {
            document.getElementById('confirm-message').textContent = message;
            confirmModal.classList.remove('hidden');
            confirmCallback = onConfirm;
        }

        function hideConfirm() {
            confirmModal.classList.add('hidden');
            confirmCallback = null;
        }

        document.getElementById('confirm-cancel').addEventListener('click', hideConfirm);
        document.getElementById('confirm-ok').addEventListener('click', () => {
            if (confirmCallback) confirmCallback();
            hideConfirm();
        });
        document.querySelector('.confirm-backdrop').addEventListener('click', hideConfirm);

        // ============================================
        // FETCH INITIAL STATE
        // ============================================
        async function fetchModelInfo() {
            try {
                const res = await fetch('/info');
                const data = await res.json();
                modelBadge.textContent = data.model || 'Unknown';
            } catch (e) {
                modelBadge.textContent = 'Offline';
            }
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        document.getElementById('new-session-btn').addEventListener('click', createNewSession);
        document.getElementById('sidebar-toggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('collapsed');
        });
        document.getElementById('sidebar-settings-btn').addEventListener('click', () => toggleSettings(true));
        document.getElementById('settings-close').addEventListener('click', () => toggleSettings(false));
        settingsOverlay.addEventListener('click', (e) => {
            if (e.target === settingsOverlay) toggleSettings(false);
        });

        sendBtn.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // Example prompt clicks
        document.querySelectorAll('.example-prompt').forEach(btn => {
            btn.addEventListener('click', () => {
                const prompt = btn.dataset.prompt;
                messageInput.value = prompt;
                messageInput.focus();
                sendMessage();
            });
        });

        // ============================================
        // INITIALIZE
        // ============================================
        async function init() {
            await loadSessions();
            await fetchModelInfo();
            updateStatsBar();
            updateSkillBadgeFromServer();
            
            if (sessions.length > 0) {
                selectSession(sessions[0].session_id);
            }
        }

        init();
    </script>
